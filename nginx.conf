# nginx.conf - Production Configuration
# PT. Holly Xaviera Export
# Security, Performance & SEO Optimized

# ==========================================================================
# Global Settings
# ==========================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # Logging Format
    # ==========================================================================
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ==========================================================================
    # Performance Optimizations
    # ==========================================================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Brotli Compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript 
    #              application/json application/javascript application/xml+rss;

    # Buffer Sizes
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 16k;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/m;

    # Connection Limits
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==========================================================================
    # SSL/TLS Configuration (Modern)
    # ==========================================================================
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # DNS Resolver for OCSP
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==========================================================================
    # Security Headers (Global)
    # ==========================================================================
    
    # Hide nginx version
    server_tokens off;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (adjust as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ==========================================================================
    # Main Server Block (HTTP -> HTTPS Redirect)
    # ==========================================================================
    
    server {
        listen 80;
        listen [::]:80;
        server_name hollyxavieraexport.com www.hollyxavieraexport.com;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # ==========================================================================
    # HTTPS Server Block
    # ==========================================================================
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hollyxavieraexport.com www.hollyxavieraexport.com;

        # SSL Certificates (update paths)
        ssl_certificate /etc/letsencrypt/live/hollyxavieraexport.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hollyxavieraexport.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/hollyxavieraexport.com/chain.pem;

        # Document Root
        root /var/www/hollyxavieraexport/public;
        index index.html;

        # ==========================================================================
        # Security Headers (Server-specific)
        # ==========================================================================
        
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # ==========================================================================
        # Connection Limits
        # ==========================================================================
        
        limit_conn conn_limit 20;
        limit_req zone=general burst=20 nodelay;

        # ==========================================================================
        # Static Assets Caching
        # ==========================================================================
        
        # HTML Files - No Cache
        location ~* \.(html|htm)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
        }

        # CSS & JS - Cache with Version
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Images - Long Cache
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # Image optimization headers
            add_header Accept-Ranges bytes;
        }

        # Fonts - Long Cache
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # Allow CORS for fonts
            add_header Access-Control-Allow-Origin "*";
        }

        # Manifest & Service Worker - No Cache
        location = /pwa/manifest.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Content-Type "application/manifest+json";
        }

        location = /pwa/sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Content-Type "application/javascript";
        }

        # ==========================================================================
        # API Proxy (Supabase)
        # ==========================================================================
        
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass https://YOUR_SUPABASE_PROJECT.supabase.co/rest/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host YOUR_SUPABASE_PROJECT.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ==========================================================================
        # Contact Form Rate Limiting
        # ==========================================================================
        
        location = /api/contact {
            limit_req zone=login burst=5 nodelay;
            
            # Proxy to your backend or Supabase Edge Function
            proxy_pass https://YOUR_SUPABASE_PROJECT.supabase.co/functions/v1/contact;
            proxy_http_version 1.1;
            proxy_set_header Host YOUR_SUPABASE_PROJECT.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
        }

        # ==========================================================================
        # SPA Fallback Routing
        # ==========================================================================
        
        location / {
            try_files $uri $uri/ /index.html;
            
            # Security headers for all responses
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ==========================================================================
        # Admin Area Protection (Optional - Add Basic Auth)
        # ==========================================================================
        
        location /admin/ {
            # Uncomment for basic auth protection
            # auth_basic "Admin Area";
            # auth_basic_user_file /etc/nginx/.htpasswd;
            
            limit_req zone=login burst=3 nodelay;
            try_files $uri $uri/ /admin/index.html;
        }

        # ==========================================================================
        # Deny Access to Sensitive Files
        # ==========================================================================
        
        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to backup files
        location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to composer/npm files
        location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ==========================================================================
        # Health Check Endpoint
        # ==========================================================================
        
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ==========================================================================
        # Error Pages
        # ==========================================================================
        
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
        }
        
        location = /50x.html {
            internal;
        }
    }

    # ==========================================================================
    # Redirect www to non-www (or vice versa)
    # ==========================================================================
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.hollyxavieraexport.com;
        
        ssl_certificate /etc/letsencrypt/live/hollyxavieraexport.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hollyxavieraexport.com/privkey.pem;
        
        return 301 https://hollyxavieraexport.com$request_uri;
    }
}
